[workspace]
members = [
    "crates/common-types",
    "crates/rustgate-auth",
    "crates/rustgate-core",
    "crates/rustgate-ledger",
    "crates/rustgate-policy",
    "crates/rustgate-storage",
    "services/rustgate-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alanAUguy13/ShelfCat-RustGate"
authors = ["ShelfCat Team"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
